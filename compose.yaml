# Local infrastructure for development: PostgreSQL and Redis.
# Use the justfile recipes: just up, just stop, just reset and just down.
# The settings come from the .env file. See .env.example.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: reliquary
      POSTGRES_USER: reliquary
      POSTGRES_PASSWORD: ${RELIQUARY_POSTGRES_PASSWORD:-reliquary}
    ports:
      - "127.0.0.1:${RELIQUARY_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=reliquary --dbname=reliquary"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:${RELIQUARY_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
