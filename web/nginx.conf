# The web app and a reverse proxy to the API. The API must be on the same site as the web app,
# because the refresh cookie has the attribute SameSite=Strict.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The API of the Compose service "api". The variable makes Nginx resolve the name at each request.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 10m;
    }

    # The files of the build have a hash in their names, so the browser can keep them.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The service worker. The browser must check it at each visit, so that a new release reaches the users.
    # A missing file gives 404, not index.html.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # The web app manifest. The mime.types file of Nginx does not always know the extension.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # The application has its own router: each other path gives index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
