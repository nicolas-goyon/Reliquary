# The frame headers of the pages. The maps of default.conf give the values: only the embed pages accept a frame of another site.
# A location with its own add_header does not get the headers of the server block, so each page location includes this file.
add_header Content-Security-Policy "frame-ancestors $reliquary_frame_ancestors" always;
add_header X-Frame-Options $reliquary_frame_options always;
