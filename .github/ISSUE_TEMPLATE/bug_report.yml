name: Bug report
description: Tell us about a behavior that does not agree with the specification.
labels: ["type: bug", "needs: triage"]
body:
  - type: markdown
    attributes:
      value: |
        Write in English. Use short sentences, one fact for each sentence.
        For a security problem, do not use this form. Read SECURITY.md.
  - type: textarea
    id: actual
    attributes:
      label: What happens
      description: Describe the behavior that you see.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expect
      description: Describe the correct behavior. Link the specification if possible.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps that show the problem
      description: Give the steps as a numbered list.
      placeholder: |
        1. Open the deck.
        2. Select "Export".
        3. ...
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Interface language
      options:
        - English
        - French
        - Both
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The version of Reliquary, or the commit of your local instance.
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Firefox 145 on Windows 11
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues, and no issue describes this problem.
          required: true
