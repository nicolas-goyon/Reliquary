version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      dotnet:
        update-types: [minor, patch]
      dotnet-major:
        update-types: [major]

  - package-ecosystem: npm
    directory: /web
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      web:
        update-types: [minor, patch]
      web-major:
        update-types: [major]

  - package-ecosystem: npm
    directory: /sdk
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      sdk:
        update-types: [minor, patch]
      sdk-major:
        update-types: [major]

  # The scheduled end-to-end test (.github/workflows/e2e.yml). Only Playwright.
  - package-ecosystem: npm
    directory: /e2e
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      e2e:
        update-types: [minor, patch]
      e2e-major:
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directories: [/, /web]
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      docker:
        update-types: [minor, patch]
      docker-major:
        update-types: [major]

  - package-ecosystem: docker-compose
    directories: [/, /deploy]
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      compose:
        update-types: [minor, patch]
      compose-major:
        update-types: [major]

  - package-ecosystem: pip
    directory: /tools/docs-site
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
