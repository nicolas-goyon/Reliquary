name: Pull request

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    name: Title follows Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          # Dependabot starts the subject with "Bump".
          subjectPattern: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && '^[Bb]ump .+[^.]$' || '^[a-z].+[^.]$' }}
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase letter and must not end with a full stop.
