name: Deployment

# Checks for the deployed instances. See docs/decisions/0042-deployed-instances-and-updates.md.
# - "Migrations": a pull request must not change, rename or delete a migration that its base contains.
# - "Update keeps the data": the gate of the milestone M2.5 (UpgradeKeepsData).
#   It installs the published images of the last release (or of develop before the first release),
#   adds data, updates to the images of this commit, rolls back, and checks the data at each step.
#   It runs once with the POSIX script reliquary-update, and once with the PowerShell script reliquary-update.ps1.
# - "PowerShell script on Windows": Windows PowerShell 5.1 reads the PowerShell script and runs --help and --init.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    name: Migrations
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check that no existing migration changed
        env:
          BASE: origin/${{ github.base_ref }}
        run: tools/deploy-tests/check-migrations.sh "$BASE"

  upgrade:
    name: Update keeps the data
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select the run
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: origin/${{ github.base_ref }}
        run: |
          set -euo pipefail
          run=true
          if [ "$EVENT" = "pull_request" ]; then
            changed=$(git diff --name-only "$(git merge-base "$BASE" HEAD)" HEAD)
            if ! printf '%s\n' "$changed" | grep --quiet --extended-regexp \
              '^(src/.*/Migrations/|src/Reliquary\.Platform/Backup/|src/Reliquary\.Cli/|deploy/|tools/deploy-tests/|Dockerfile$|web/Dockerfile$|web/nginx|\.github/workflows/deployment\.yml$)'; then
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Run the gate: $run."

      - name: Sign in to the registry
        if: steps.scope.outputs.run == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select the old version
        if: steps.scope.outputs.run == 'true'
        id: old
        run: |
          set -euo pipefail
          prefix=ghcr.io/${{ github.repository_owner }}/reliquary
          old=""
          for candidate in latest develop; do
            if docker pull --quiet "$prefix-cli:$candidate" >/dev/null 2>&1; then
              old=$candidate
              break
            fi
          done
          if [ -z "$old" ] || ! docker run --rm --entrypoint test "$prefix-cli:$old" -f /app/deploy/compose.yaml; then
            echo "::notice::No published CLI image contains the deployment files yet. The gate starts after the first image of develop with them."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$old" >> "$GITHUB_OUTPUT"
          echo "Old version: $old."

      - name: Build the images of this commit
        if: steps.old.outputs.version != ''
        run: |
          set -euo pipefail
          prefix=ghcr.io/${{ github.repository_owner }}/reliquary
          for target in api worker cli; do
            docker build --quiet --target "$target" --build-arg RELIQUARY_VERSION=0.0.0-ci --tag "$prefix-$target:ci" .
          done
          docker build --quiet --build-arg RELIQUARY_VERSION=0.0.0-ci --tag "$prefix-web:ci" web

      - name: Install the old version, update, roll back and check the data
        if: steps.old.outputs.version != ''
        env:
          OLD_VERSION: ${{ steps.old.outputs.version }}
          OLD_PULL: "true"
          NEW_PULL: "false"
        run: tools/deploy-tests/upgrade-keeps-data.sh "$OLD_VERSION" ci

      - name: Do the same with the PowerShell script
        if: steps.old.outputs.version != ''
        env:
          OLD_VERSION: ${{ steps.old.outputs.version }}
          OLD_PULL: "true"
          NEW_PULL: "false"
          UPDATE_SCRIPT: pwsh
        run: tools/deploy-tests/upgrade-keeps-data.sh "$OLD_VERSION" ci

  windows:
    name: PowerShell script on Windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The runners of Windows cannot run Linux containers, so this job checks the script with no Docker.
      # The job "Update keeps the data" runs the full test with PowerShell 7 on Linux.
      - name: Read the script with Windows PowerShell 5.1
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\deploy\reliquary-update.ps1", [ref] $null, [ref] $errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }

      - name: Check the rules of PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = @(Invoke-ScriptAnalyzer -Path deploy/reliquary-update.ps1 -Settings tools/deploy-tests/PSScriptAnalyzerSettings.psd1)
          $results | Format-Table -AutoSize | Out-String -Width 200
          if ($results.Count -gt 0) { exit 1 }

      - name: Run --help and --init with Windows PowerShell 5.1
        shell: powershell
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'instance'
          New-Item -ItemType Directory -Path $folder | Out-Null
          Copy-Item deploy\reliquary-update.ps1, deploy\.env.example -Destination $folder
          powershell -NoProfile -ExecutionPolicy Bypass -File "$folder\reliquary-update.ps1" --help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File "$folder\reliquary-update.ps1" --init develop
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $bytes = [System.IO.File]::ReadAllBytes("$folder\.env")
          if ($bytes[0] -eq 0xEF) { Write-Error 'The .env file starts with a byte order mark.'; exit 1 }
          $text = [System.IO.File]::ReadAllText("$folder\.env")
          foreach ($pattern in '(?m)^RELIQUARY_VERSION=develop$', '(?m)^RELIQUARY_SIGNING_KEY=\S{44}$', '(?m)^RELIQUARY_POSTGRES_PASSWORD=[0-9a-f]{48}$') {
            if ($text -notmatch $pattern) { Write-Error "The .env file does not match $pattern."; exit 1 }
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File "$folder\reliquary-update.ps1" --init develop
          if ($LASTEXITCODE -ne 1) { Write-Error 'A second --init must fail.'; exit 1 }
          'The script works with Windows PowerShell 5.1.'
          # The second --init sets LASTEXITCODE to 1, and the runner uses LASTEXITCODE as the result of the step.
          exit 0
