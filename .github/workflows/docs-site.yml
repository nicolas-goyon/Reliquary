name: Documentation site

# Builds the documentation site from docs/ with MkDocs Material (see mkdocs.yml).
# A pull request builds the site and checks it. A push to develop also publishes it on GitHub Pages:
# https://nicolas-goyon.github.io/reliquary/
# The site also gives the update scripts of develop for download, in /downloads/.

on:
  pull_request:
    branches: [develop, main]
    paths:
      - docs/**
      - mkdocs.yml
      - tools/docs-site/**
      - .github/workflows/docs-site.yml
      - deploy/reliquary-update
      - deploy/reliquary-update.ps1
  push:
    branches: [develop]
    paths:
      - docs/**
      - mkdocs.yml
      - tools/docs-site/**
      - .github/workflows/docs-site.yml
      - deploy/reliquary-update
      - deploy/reliquary-update.ps1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/docs-site/requirements.txt

      - name: Install MkDocs Material
        run: pip install -r tools/docs-site/requirements.txt

      - name: Build the site
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build --strict

      # The scripts work with all the versions, so the site gives the scripts of develop.
      - name: Add the update scripts for download
        run: |
          mkdir -p site/downloads
          cp deploy/reliquary-update deploy/reliquary-update.ps1 site/downloads/

      - name: Keep the site for GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publish
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
