# The documentation site on GitHub Pages: https://nicolas-goyon.github.io/reliquary/
# The workflow "Documentation site" builds it from the folder docs/. Build it on your computer with: just docs-site
site_name: Reliquary
site_description: "Documentation of Reliquary, a deck builder and collection manager for Magic: The Gathering"
site_url: https://nicolas-goyon.github.io/reliquary/
repo_url: https://github.com/nicolas-goyon/reliquary
repo_name: nicolas-goyon/reliquary
edit_uri: edit/develop/docs/
docs_dir: docs
site_dir: site
copyright: Free software under the AGPL-3.0 license.

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    # Select "Windows" or "Linux" in one tab group, and the site shows the same system in all the tab groups.
    - content.tabs.link
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  # The tabs for Linux and Windows. The syntax "/// tab | Linux" needs no indent, so markdownlint reads the content as usual Markdown.
  # The Markdown files indent the content of a list item by 2 or 3 spaces, as CommonMark and GitHub allow. Python-Markdown needs 4 spaces without this extension.
  - mdx_truly_sane_lists:
      nested_indent: 2
  - pymdownx.blocks.tab:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

# The pages of the folder docs/ can link to files of the repository outside docs/, for example ../CONTRIBUTING.md.
# The site does not contain these files, so these links are not errors.
validation:
  links:
    not_found: info
    unrecognized_links: info

not_in_nav: |
  /architecture/
  /contributing/
  /decisions/
  /development/
  /specification/

nav:
  - Home: README.md
  - Install and operate:
      - Overview: deployment/index.md
      - Requirements: deployment/requirements.md
      - Local instance: deployment/local-development.md
      - Pre-production instance: deployment/pre-production.md
      - Production instance: deployment/production.md
      - Kubernetes: deployment/kubernetes.md
      - Versions and updates: deployment/versions-and-updates.md
      - Troubleshooting: deployment/troubleshooting.md
  - Product:
      - Specification: specification/README.md
      - Roadmap: roadmap.md
      - Glossary: glossary.md
  - Development:
      - Getting started: development/getting-started.md
      - Backup and restore: development/backup-and-restore.md
      - Card data: development/card-data.md
      - Web app: development/web-app.md
      - Observability: development/observability.md
      - Translations: development/translations.md
      - Writing style: contributing/writing-style.md
  - Architecture:
      - Overview: architecture/overview.md
      - Decision records: decisions/README.md
