apiVersion: v1
kind: Service
metadata:
  name: {{ include "reliquary.fullname" . }}-api
  labels:
    {{- include "reliquary.componentLabels" (dict "context" . "component" "api") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "reliquary.selectorLabels" (dict "context" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
