# The entry point of the site. Send all the paths of the site to this Service.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "reliquary.fullname" . }}-web
  labels:
    {{- include "reliquary.componentLabels" (dict "context" . "component" "web") | nindent 4 }}
spec:
  type: {{ .Values.web.service.type }}
  selector:
    {{- include "reliquary.selectorLabels" (dict "context" . "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
