{{- if not .Values.secrets.existingSecret }}
{{- $secrets := .Values.secrets }}
# The secret settings, from the values of the chart. For a production instance, make your own Secret and set secrets.existingSecret.
# The migration Job runs before the other resources, so the Secret is a hook that Helm makes before the Job.
# "helm uninstall" does not delete a hook. Delete the Secret with kubectl after the uninstall.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "reliquary.secretName" . }}
  labels:
    {{- include "reliquary.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  Auth__SigningKey: {{ required "Set secrets.signingKey, or set secrets.existingSecret." $secrets.signingKey | quote }}
  ConnectionStrings__Users: {{ required "Set secrets.connectionStrings.users, or set secrets.existingSecret." $secrets.connectionStrings.users | quote }}
  {{- with $secrets.connectionStrings.reference }}
  ConnectionStrings__Reference: {{ . | quote }}
  {{- end }}
  {{- if not .Values.redis.enabled }}
  ConnectionStrings__Redis: {{ required "Set secrets.connectionStrings.redis, or set redis.enabled to true." $secrets.connectionStrings.redis | quote }}
  {{- end }}
  {{- with $secrets.smtpPassword }}
  Email__Smtp__Password: {{ . | quote }}
  {{- end }}
  {{- with $secrets.googleClientSecret }}
  Auth__Providers__Google__ClientSecret: {{ . | quote }}
  {{- end }}
  {{- range $keyId, $key := $secrets.vaultKeys }}
  Plugins__VaultKeys__{{ $keyId }}: {{ $key | quote }}
  {{- end }}
  {{- range $name, $value := $secrets.extra }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
{{- end }}
