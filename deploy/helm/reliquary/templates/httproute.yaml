{{- if .Values.httpRoute.enabled }}
# Sends all the paths of the site to the web Service. The web app sends /api to the API.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "reliquary.fullname" . }}
  labels:
    {{- include "reliquary.componentLabels" (dict "context" . "component" "web") | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- required "Set httpRoute.parentRefs, the Gateway of the route." .Values.httpRoute.parentRefs | toYaml | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "reliquary.fullname" . }}-web
          port: {{ .Values.web.service.port }}
      {{- with .Values.httpRoute.timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
